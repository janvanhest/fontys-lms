services:
  postgres:
    image: pgvector/pgvector:pg16
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  ollama:
    image: ollama/ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    entrypoint:
      - /bin/sh
      - -c
      - |
        ollama serve &
        pid=$$!
        until ollama list >/dev/null 2>&1; do
          sleep 2
        done
        ollama show nomic-embed-text >/dev/null 2>&1 || ollama pull nomic-embed-text
        wait "$$pid"
    healthcheck:
      test: ["CMD-SHELL", "ollama show nomic-embed-text >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 10s

  mock-api:
    build:
      context: ./mock-api
    ports:
      - "3002:3002"
    volumes:
      - ./mock-api/db.json:/app/db.json:ro

volumes:
  ollama_data:
  postgres-data:
  backend-node-modules:
  backend-pnpm-store:
  frontend-node-modules:
  frontend-pnpm-store:
