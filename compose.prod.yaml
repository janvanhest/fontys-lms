services:
  backend:
    build:
      context: ./backend
      target: production
    environment:
      PORT: 3000
      NODE_ENV: production
      CORS_ORIGINS: http://localhost:4173
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      target: production
      args:
        VITE_CHUCK_API_MODE: mock
        VITE_CHUCK_API_BASE_URL: http://localhost:3002
    ports:
      - "4173:4173"
    depends_on:
      - mock-api
