services:
  mock-api:
    build: ./mock-api
    ports:
      - "3002:3002"
    volumes:
      - ./mock-api/db.json:/app/db.json:ro

  frontend:
    build:
      context: ./frontend
      target: development
    environment:
      VITE_CHUCK_API_MODE: mock
      VITE_CHUCK_API_BASE_URL: http://localhost:3002
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
      - frontend-pnpm-store:/pnpm/store
    depends_on:
      - mock-api

  frontend-prod:
    build:
      context: ./frontend
      target: production
    environment:
      VITE_CHUCK_API_MODE: mock
      VITE_CHUCK_API_BASE_URL: http://localhost:3002
    ports:
      - "4173:4173"
    depends_on:
      - mock-api
    profiles:
      - prod

volumes:
  frontend-node-modules:
  frontend-pnpm-store:
