services:
  mock-api:
    build:
      context: ./mock-api
    ports:
      - "3002:3002"
    volumes:
      - ./mock-api/db.json:/app/db.json:ro

  postgres:
    image: pgvector/pgvector:pg16
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  backend:
    build:
      context: ./backend
      target: development
    environment:
      PORT: 3000
      NODE_ENV: development
      CORS_ORIGINS: http://localhost:5173
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/app
      - backend-node-modules:/app/node_modules
      - backend-pnpm-store:/pnpm/store
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      target: development
    environment:
      VITE_CHUCK_API_MODE: mock
      VITE_CHUCK_API_BASE_URL: http://localhost:3002
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
      - frontend-pnpm-store:/pnpm/store
    depends_on:
      - mock-api

  frontend-prod:
    build:
      context: ./frontend
      target: production
      args:
        VITE_CHUCK_API_MODE: mock
        VITE_CHUCK_API_BASE_URL: http://localhost:3002
    ports:
      - "4173:4173"
    depends_on:
      - mock-api
    profiles:
      - prod

volumes:
  frontend-node-modules:
  frontend-pnpm-store:
  backend-node-modules:
  backend-pnpm-store:
  postgres-data:
