  <rect x="1324" y="2020" width="16" height="16" fill="#14101A"/>
  <rect x="1328" y="2024" width="8" height="8" fill="#F5F2F7"/>
  <rect x="1372" y="2020" width="16" height="16" fill="#14101A"/>
  <rect x="1376" y="2024" width="8" height="8" fill="#F5F2F7"/>
  <rect x="1324" y="2068" width="16" height="16" fill="#14101A"/>
  <rect x="1328" y="2072" width="8" height="8" fill="#F5F2F7"/>
  <rect x="1350" y="2024" width="7" height="7" fill="#14101A"/>
  <rect x="1362" y="2038" width="7" height="7" fill="#14101A"/>
  <rect x="1346" y="2048" width="7" height="7" fill="#14101A"/>
